<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSA Quest — Profile</title>
  <meta name="description" content="Your DSA Quest profile — stats, badges, level, and chapter breakdown." />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .profile-hero {
      background: linear-gradient(135deg, rgba(124,58,237,0.1), rgba(0,212,255,0.06));
      border: 1px solid rgba(124,58,237,0.25);
      border-radius: var(--radius-xl);
      padding: 32px;
      display: flex;
      align-items: center;
      gap: 28px;
      flex-wrap: wrap;
      position: relative;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .profile-hero::before {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(124,58,237,0.2), transparent 70%);
      pointer-events: none;
    }

    .profile-avatar-lg {
      width: 110px; height: 110px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 52px;
      border: 3px solid transparent;
      background: linear-gradient(var(--bg-card), var(--bg-card)) padding-box,
                  linear-gradient(135deg, var(--purple), var(--cyan)) border-box;
      flex-shrink: 0;
      box-shadow: 0 0 40px rgba(124,58,237,0.3);
      position: relative;
      cursor: pointer;
      transition: var(--transition);
    }
    .profile-avatar-lg:hover { transform: scale(1.05); box-shadow: 0 0 60px rgba(124,58,237,0.5); }

    .avatar-edit {
      position: absolute;
      bottom: 4px; right: 4px;
      width: 26px; height: 26px;
      border-radius: 50%;
      background: var(--purple);
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
      border: 2px solid var(--bg-card);
    }

    .profile-info { flex: 1; }
    .profile-name { font-size: 28px; font-weight: 800; font-family: 'Orbitron', sans-serif; }
    .profile-level { font-size: 14px; margin-top: 6px; font-weight: 600; }
    .profile-joined { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .profile-badges-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .profile-badge-icon { font-size: 22px; }

    .xp-ring-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .xp-ring-label { font-size: 11px; color: var(--text-secondary); text-align: center; }

    .profile-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .chapter-stat-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .chapter-stat-row:last-child { border-bottom: none; }
    .ch-stat-icon { font-size: 20px; width: 32px; text-align: center; flex-shrink: 0; }
    .ch-stat-info { flex: 1; min-width: 0; }
    .ch-stat-name { font-size: 13px; font-weight: 600; }
    .ch-stat-pct { font-size: 12px; font-weight: 700; white-space: nowrap; }

    .avatar-picker {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 16px;
    }
    .avatar-option {
      width: 48px; height: 48px;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      cursor: pointer;
      border: 2px solid transparent;
      background: var(--bg-secondary);
      transition: var(--transition);
    }
    .avatar-option:hover { border-color: var(--purple); transform: scale(1.1); }
    .avatar-option.selected { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,212,255,0.3); }

    .level-timeline {
      display: flex;
      flex-direction: column;
      gap: 0;
    }
    .timeline-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 0;
      border-left: 2px solid var(--border);
      padding-left: 20px;
      position: relative;
    }
    .timeline-dot {
      position: absolute;
      left: -6px;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--border);
      border: 2px solid var(--bg-card);
    }
    .timeline-item.achieved .timeline-dot {
      background: var(--green);
      box-shadow: 0 0 8px rgba(0,255,136,0.5);
    }
    .timeline-item.current .timeline-dot {
      background: var(--cyan);
      box-shadow: 0 0 8px rgba(0,212,255,0.5);
      animation: pulse 1.5s infinite;
    }
    .timeline-item.achieved { border-left-color: rgba(0,255,136,0.3); }
    .timeline-item.current { border-left-color: rgba(0,212,255,0.3); }
    .timeline-lvl-num { font-family: 'Orbitron', sans-serif; font-size: 14px; font-weight: 700; width: 60px; }
    .timeline-title { font-size: 14px; font-weight: 600; flex: 1; }
    .timeline-xp { font-size: 12px; color: var(--text-secondary); }
  </style>
</head>
<body>
  <div id="nav-placeholder"></div>

  <main class="main-content">
    <header class="page-header">
      <div>
        <div class="page-title">👤 Profile</div>
        <div class="page-subtitle">Your stats, achievements, and progress overview</div>
      </div>
      <div class="header-actions">
        <button class="btn btn-cyan" onclick="showEditModal()">✏️ Edit Profile</button>
        <button class="btn btn-primary" onclick="Auth.logout()">🚪 Log Out</button>
        <button class="btn btn-ghost" onclick="handleReset()">🗑️ Reset</button>
      </div>
    </header>

    <div class="page-body">
      <!-- Hero Card -->
      <div class="profile-hero fade-in" id="profile-hero"></div>

      <!-- Stats + Level -->
      <div class="profile-grid fade-in-delay-1" style="margin-bottom:20px;">
        <!-- Chapter Breakdown -->
        <div class="card">
          <div class="card-title">📊 Chapter Breakdown</div>
          <div id="chapter-breakdown"></div>
        </div>

        <!-- Level Timeline -->
        <div class="card">
          <div class="card-title">🚀 Level Journey</div>
          <div class="level-timeline" id="level-timeline"></div>
        </div>
      </div>

      <!-- Badges Showcase -->
      <div class="card fade-in-delay-2">
        <div class="card-title" style="display:flex;justify-content:space-between;align-items:center;">
          <span>🎖️ Badge Showcase</span>
          <a href="badges.html" style="font-size:12px;color:var(--cyan);text-decoration:none;">All Badges →</a>
        </div>
        <div id="profile-badges" style="display:flex;flex-wrap:wrap;gap:12px;"></div>
      </div>
    </div>
  </main>

  <!-- Edit Profile Modal -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Edit Profile</div>
        <button class="modal-close" onclick="closeEditModal()">✕</button>
      </div>
      <div>
        <label class="input-label">Name</label>
        <input type="text" id="edit-name" class="input-field" placeholder="Enter your name" maxlength="30" />
        <div style="margin-top:16px;">
          <label class="input-label">Choose Avatar</label>
          <div class="avatar-picker" id="avatar-picker"></div>
        </div>
        <button class="btn btn-primary w-full" style="margin-top:20px" onclick="saveProfile()">Save Changes</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script>
    let selectedAvatar;
    document.addEventListener('dsaquest_ready', () => {
      document.getElementById('nav-placeholder').innerHTML = buildNav('profile');
      selectedAvatar = Engine.getProfile().avatar;
      renderHero();
      renderChapterBreakdown();
      renderLevelTimeline();
      renderBadges();
    });

    const AVATARS = ['⚔️','🛡️','🔮','🌟','⚡','🧠','🔥','💎','🐉','🦁','🎯','🔗','🕸️','🌲','🏆','👑','🚀','🌠','💪','🎖️'];

    function renderHero() {
      const summary = Engine.getSummary();
      const { profile, streak, completedCount, totalSubtopics, pctComplete, levelProgress, badgeCount } = summary;
      const lvl = levelProgress.current;
      const next = levelProgress.next;
      const circumference = 2 * Math.PI * 42;
      const dashOffset = circumference - (levelProgress.pct / 100) * circumference;
      const joinDate = new Date(profile.joinedAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
      const earnedBadges = DSA_DATA.badges.filter(b => Engine.hasBadge(b.id));

      document.getElementById('profile-hero').innerHTML = `
        <div class="profile-avatar-lg" onclick="showEditModal()">
          ${profile.avatar}
          <div class="avatar-edit">✏️</div>
        </div>

        <div class="profile-info">
          <div class="profile-name" style="color:${lvl.color}">${profile.name}</div>
          <div class="profile-level" style="color:${lvl.color}">⚡ Level ${lvl.level} — ${lvl.title}</div>
          <div class="profile-joined">📅 Joined ${joinDate}</div>
          <div style="display:flex;gap:20px;margin-top:16px;flex-wrap:wrap;">
            <div>
              <div style="font-family:'Orbitron',sans-serif;font-size:20px;font-weight:700;color:var(--gold)">${profile.xp.toLocaleString()}</div>
              <div style="font-size:11px;color:var(--text-secondary)">Total XP</div>
            </div>
            <div>
              <div style="font-family:'Orbitron',sans-serif;font-size:20px;font-weight:700;color:#fb923c">${streak.current}🔥</div>
              <div style="font-size:11px;color:var(--text-secondary)">Day Streak</div>
            </div>
            <div>
              <div style="font-family:'Orbitron',sans-serif;font-size:20px;font-weight:700;color:var(--green)">${pctComplete}%</div>
              <div style="font-size:11px;color:var(--text-secondary)">Complete</div>
            </div>
            <div>
              <div style="font-family:'Orbitron',sans-serif;font-size:20px;font-weight:700;color:var(--purple-light)">${badgeCount}</div>
              <div style="font-size:11px;color:var(--text-secondary)">Badges</div>
            </div>
          </div>
          ${earnedBadges.length > 0 ? `
            <div class="profile-badges-row">
              ${earnedBadges.map(b => `<span class="profile-badge-icon" title="${b.name}">${b.icon}</span>`).join('')}
            </div>
          ` : ''}
        </div>

        <div class="xp-ring-wrap">
          <svg width="100" height="100" viewBox="0 0 100 100" style="transform:rotate(-90deg)">
            <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="8"/>
            <circle cx="50" cy="50" r="42" fill="none"
              stroke="${lvl.color}" stroke-width="8"
              stroke-dasharray="${circumference.toFixed(1)}"
              stroke-dashoffset="${dashOffset.toFixed(1)}"
              stroke-linecap="round"/>
          </svg>
          <div style="position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100px;height:100px;top:0">
            <div style="font-family:'Orbitron',sans-serif;font-size:22px;font-weight:700;color:${lvl.color}">${lvl.level}</div>
            <div style="font-size:10px;color:var(--text-muted)">LEVEL</div>
          </div>
          <div class="xp-ring-label">
            ${next ? `${profile.xp}/${next.minXp} XP` : 'MAX LEVEL'}
          </div>
        </div>
      `;

      // Fix ring overlap issue
      const ringWrap = document.querySelector('.xp-ring-wrap');
      ringWrap.style.position = 'relative';
    }

    function renderChapterBreakdown() {
      document.getElementById('chapter-breakdown').innerHTML = DSA_DATA.chapters.map(ch => {
        const prog = Engine.getChapterProgress(ch.id);
        return `
          <div class="chapter-stat-row">
            <div class="ch-stat-icon">${ch.icon}</div>
            <div class="ch-stat-info">
              <div class="ch-stat-name">${ch.name}</div>
              <div style="margin-top:4px;">
                <div class="xp-bar-container" style="height:5px;">
                  <div class="xp-bar-fill" style="width:${prog.pct}%;height:5px;background:linear-gradient(90deg,${ch.color}88,${ch.color})"></div>
                </div>
              </div>
            </div>
            <div class="ch-stat-pct" style="color:${ch.color}">${prog.pct}%</div>
          </div>
        `;
      }).join('');
    }

    function renderLevelTimeline() {
      const profile = Engine.getProfile();
      const current = Engine.getLevelForXP(profile.xp);

      document.getElementById('level-timeline').innerHTML = DSA_DATA.levels.map(lvl => {
        const achieved = profile.xp >= lvl.minXp;
        const isCurrent = lvl.level === current.level;
        return `
          <div class="timeline-item ${achieved ? 'achieved' : ''} ${isCurrent ? 'current' : ''}">
            <div class="timeline-dot"></div>
            <div class="timeline-lvl-num" style="color:${lvl.color}">Lv. ${lvl.level}</div>
            <div class="timeline-title" style="${achieved ? `color:${lvl.color}` : 'color:var(--text-muted)'}">${lvl.title}</div>
            <div class="timeline-xp">${lvl.minXp.toLocaleString()} XP</div>
            ${isCurrent ? '<span style="font-size:11px;color:var(--cyan);font-weight:700;">← You</span>' : ''}
            ${achieved && !isCurrent ? '<span style="font-size:14px;">✅</span>' : ''}
          </div>
        `;
      }).join('');
    }

    function renderBadges() {
      const earnedBadges = Object.keys(Engine.getBadges());
      const container = document.getElementById('profile-badges');

      if (!earnedBadges.length) {
        container.innerHTML = '<div style="color:var(--text-muted);font-size:13px;padding:20px 0;">Complete subtopics to earn your first badge! Start with the Roadmap. 🗡️</div>';
        return;
      }

      container.innerHTML = DSA_DATA.badges.map(b => {
        const unlocked = earnedBadges.includes(b.id);
        return `
          <div style="
            padding: 12px 14px;
            border-radius: var(--radius);
            background: ${unlocked ? 'rgba(251,191,36,0.08)' : 'rgba(255,255,255,0.03)'};
            border: 1px solid ${unlocked ? 'rgba(251,191,36,0.25)' : 'rgba(255,255,255,0.06)'};
            display: flex; align-items: center; gap: 10px;
            filter: ${unlocked ? 'none' : 'grayscale(1)'};
            opacity: ${unlocked ? '1' : '0.4'};
            min-width: 160px;
          ">
            <span style="font-size:24px;">${b.icon}</span>
            <div>
              <div style="font-size:13px;font-weight:700;">${b.name}</div>
              <div style="font-size:11px;color:var(--text-secondary)">${b.desc}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Edit Modal
    function showEditModal() {
      const profile = Engine.getProfile();
      document.getElementById('edit-name').value = profile.name;
      renderAvatarPicker(profile.avatar);
      document.getElementById('edit-modal').classList.add('show');
    }

    function closeEditModal() {
      document.getElementById('edit-modal').classList.remove('show');
    }

    function renderAvatarPicker(selected) {
      document.getElementById('avatar-picker').innerHTML = AVATARS.map(a => `
        <div class="avatar-option ${a === selected ? 'selected' : ''}"
             onclick="selectAvatar('${a}', this)">${a}</div>
      `).join('');
    }

    // Initialized in dsaquest_ready
    function selectAvatar(a, el) {
      selectedAvatar = a;
      document.querySelectorAll('.avatar-option').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
    }

    function saveProfile() {
      const name = document.getElementById('edit-name').value.trim() || 'Warrior';
      Engine.updateProfile({ name, avatar: selectedAvatar });
      closeEditModal();
      renderHero();
      Toast.info('Profile updated!');
    }

    document.getElementById('edit-modal').addEventListener('click', e => {
      if (e.target === document.getElementById('edit-modal')) closeEditModal();
    });

    async function handleReset() {
      if (!confirm('Reset all progress? This will erase all your XP, badges, and streaks from the database!')) return;
      Auth.showLoading("Resetting Quest logs...", "Wiping progress from cloud...");
      try {
        const token = await Auth.getToken();
        if (token) {
          const payload = {
            profile: {
              name: Auth.getUser().displayName || 'Warrior',
              avatar: '⚔️',
              xp: 0,
              level: 1,
              joinedAt: new Date().toISOString()
            },
            progress: {},
            badges: {},
            streak: { current: 0, longest: 0, lastActive: null, milestones: [] },
            heatmap: {},
            xpLog: {}
          };
          await fetch('/api/progress', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(payload)
          });
        }
      } catch (err) {
        console.warn("Failed to clear database during reset:", err);
      }
      Engine.reset();
      location.reload();
    }
  </script>
</body>
</html>
