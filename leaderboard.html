<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DSA Quest — Leaderboard</title>
  <meta name="description" content="Compete with your squad and track your rank on the DSA Quest leaderboard." />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .lb-header-card {
      background: linear-gradient(135deg, rgba(251,191,36,0.12), rgba(124,58,237,0.08));
      border: 1px solid rgba(251,191,36,0.25);
      border-radius: var(--radius-xl);
      padding: 24px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .podium {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 8px;
      margin: 24px 0 8px;
    }

    .podium-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .podium-avatar {
      width: 56px; height: 56px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 26px;
      border: 3px solid transparent;
      position: relative;
    }

    .podium-rank {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 99px;
      text-align: center;
    }

    .podium-name { font-size: 12px; font-weight: 700; text-align: center; }
    .podium-xp { font-size: 11px; text-align: center; font-family: 'Orbitron', sans-serif; }

    .podium-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px 6px 0 0;
      font-size: 20px;
      width: 72px;
    }

    .podium-1st .podium-avatar { border-color: var(--gold); box-shadow: 0 0 20px rgba(251,191,36,0.5); }
    .podium-2nd .podium-avatar { border-color: #94a3b8; box-shadow: 0 0 15px rgba(148,163,184,0.3); }
    .podium-3rd .podium-avatar { border-color: #b45309; box-shadow: 0 0 15px rgba(180,83,9,0.3); }

    .crown { position: absolute; top: -18px; font-size: 22px; animation: crownBounce 2s ease-in-out infinite; }
    @keyframes crownBounce { 0%,100%{transform:translateY(0) rotate(-5deg)} 50%{transform:translateY(-5px) rotate(5deg)} }

    .lb-you-highlight {
      border-left: 3px solid var(--cyan);
    }

    .global-row {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 14px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      transition: var(--transition);
      margin-bottom: 4px;
    }
    .global-row:hover { background: var(--bg-card-hover); border-color: var(--border); }
    .global-row.you { border-color: rgba(0,212,255,0.3); background: rgba(0,212,255,0.04); }

    .global-rank { font-family:'Orbitron',sans-serif; font-size:14px; font-weight:700; width:28px; text-align:center; flex-shrink:0; }
    .global-avatar { width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;border:2px solid var(--border); }
    .global-name { flex:1;font-size:13px;font-weight:600; }
    .global-xp { font-size:13px;font-weight:700;font-family:'Orbitron',sans-serif;color:var(--gold); }

    .you-tag {
      font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;
      background:rgba(0,212,255,0.15);color:var(--cyan);border:1px solid rgba(0,212,255,0.3);
      margin-left:6px;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    .weekly-winner {
      background: linear-gradient(135deg,rgba(251,191,36,0.1),rgba(249,115,22,0.06));
      border:1px solid rgba(251,191,36,0.3);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      display:flex;align-items:center;gap:16px;margin-bottom:20px;
    }
  </style>
</head>
<body>
  <div id="nav-placeholder"></div>

  <main class="main-content">
    <header class="page-header">
      <div>
        <div class="page-title">🏆 Leaderboard</div>
        <div class="page-subtitle">Overall standings of all warriors on the platform</div>
      </div>
      <div class="header-actions">
        <a href="squad.html" class="btn btn-cyan">⚔️ Manage Squad</a>
      </div>
    </header>

    <div class="page-body">
      <!-- Weekly Winner / Spotlight -->
      <div class="weekly-winner fade-in" id="weekly-winner"></div>

      <!-- Global Podium -->
      <div id="podium-section" class="fade-in-delay-1" style="margin-bottom:20px;"></div>

      <!-- Leaderboard List -->
      <div class="card fade-in-delay-2">
        <div class="card-title">🌏 Global Rankings</div>
        <div id="global-list"></div>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script>
    let globalList = [];

    async function fetchLeaderboardData() {
      try {
        const token = await Auth.getToken();
        if (!token) return;
        const res = await fetch('/api/leaderboard', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
          const data = await res.json();
          globalList = data.globalList || [];
        }
      } catch (err) {
        console.warn("Failed to fetch leaderboard data:", err);
      }
    }

    document.addEventListener('dsaquest_ready', async () => {
      document.getElementById('nav-placeholder').innerHTML = buildNav('leaderboard');
      await fetchLeaderboardData();
      renderGlobal();
    });

    function renderGlobal() {
      const profile = Engine.getProfile();
      const xp = profile.xp;

      // Simulated global players fallback if database is empty/new
      const globalNames = [
        {name:'AlgoMaster99',avatar:'🧠',xp:18700},
        {name:'CodeNinja_X',avatar:'⚡',xp:17200},
        {name:'DSA_Sensei',avatar:'🎓',xp:15800},
        {name:'PixelWarrior',avatar:'🛡️',xp:14300},
        {name:'ByteHunter',avatar:'🔮',xp:13100},
        {name:'QuantumCoder',avatar:'🌀',xp:12400},
        {name:'NullPointer',avatar:'🔗',xp:11800},
        {name:'HeapMaster',avatar:'⛰️',xp:11200},
        {name:'TreeWalker',avatar:'🌲',xp:10500},
        {name:'GraphGuru',avatar:'🕸️',xp:9800},
        {name:'SortingHat',avatar:'🎩',xp:9100},
        {name:'RecurMancer',avatar:'🔄',xp:8400},
        {name:'DPWizard',avatar:'🧙',xp:7700},
        {name:'BitFlip',avatar:'⚙️',xp:7100},
        {name:'Arjun Sharma',avatar:'⚔️',xp:6800},
        {name:'HashQueen',avatar:'#️⃣',xp:6200},
        {name:'StackAttack',avatar:'📚',xp:5700},
        {name:'QueueKing',avatar:'🔮',xp:5100},
        {name:'LinkedLegend',avatar:'🔗',xp:4600},
        {name:'Priya Patel',avatar:'🌟',xp:4200},
      ];

      let allGlobal = [];
      if (globalList.length === 0) {
        allGlobal = [...globalNames, {name: profile.name, avatar: profile.avatar, xp, isYou: true}]
          .sort((a,b) => b.xp - a.xp)
          .slice(0, 30);
      } else {
        const summary = Engine.getSummary();
        allGlobal = globalList.map(u => ({
          name: u.name,
          avatar: u.avatar,
          xp: u.xp,
          isYou: u.name === summary.profile.name || u.isYou
        })).sort((a,b) => b.xp - a.xp);
      }

      // Render Weekly Winner Section
      const champion = allGlobal[0] || { name: 'AlgoMaster99', avatar: '🧠', xp: 18700 };
      document.getElementById('weekly-winner').innerHTML = `
        <div style="font-size:36px;">🏆</div>
        <div>
          <div style="font-size:11px;font-weight:700;letter-spacing:0.1em;color:var(--gold);text-transform:uppercase;">Current Champion</div>
          <div style="font-size:18px;font-weight:700;margin-top:2px;">${champion.name} ${champion.avatar}</div>
          <div style="font-size:13px;color:var(--text-secondary);">${champion.xp.toLocaleString()} total XP · Leading the arena!</div>
        </div>
      `;

      // Render Podium Section (Top 3)
      const top3 = allGlobal.slice(0, 3);
      let podiumOrder = [];
      let heights = [];
      let colors = [];
      let bgs = [];
      let nums = [];

      if (top3.length === 1) {
        podiumOrder = [top3[0]];
        heights = ['120px'];
        colors = ['var(--gold)'];
        bgs = ['rgba(251,191,36,0.1)'];
        nums = [1];
      } else if (top3.length === 2) {
        podiumOrder = [top3[0], top3[1]];
        heights = ['120px', '90px'];
        colors = ['var(--gold)', '#94a3b8'];
        bgs = ['rgba(251,191,36,0.1)', 'rgba(148,163,184,0.1)'];
        nums = [1, 2];
      } else if (top3.length >= 3) {
        podiumOrder = [top3[1], top3[0], top3[2]];
        heights = ['90px', '120px', '70px'];
        colors = ['#94a3b8', 'var(--gold)', '#b45309'];
        bgs = ['rgba(148,163,184,0.1)', 'rgba(251,191,36,0.1)', 'rgba(180,83,9,0.1)'];
        nums = [2, 1, 3];
      }

      document.getElementById('podium-section').innerHTML = `
        <div class="card card-glow-gold mb-20">
          <div class="podium">
            ${podiumOrder.map((m, i) => {
              return `
                <div class="podium-slot podium-${nums[i]}${nums[i] === 1 ? 'st' : nums[i] === 2 ? 'nd' : 'rd'}">
                  <div class="podium-name">${m.name.split(' ')[0]}${m.isYou ? ' (You)' : ''}</div>
                  <div class="podium-avatar" style="border-color:${colors[i]};box-shadow:0 0 15px ${colors[i]}44;">
                    ${nums[i] === 1 ? '<div class="crown">👑</div>' : ''}
                    ${m.avatar}
                  </div>
                  <div class="podium-xp" style="color:${colors[i]}">${m.xp.toLocaleString()} XP</div>
                  <div class="podium-bar" style="height:${heights[i]};background:${bgs[i]};border:1px solid ${colors[i]}44;">
                    ${nums[i]}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;

      // Render List View
      const rankIcons = ['🥇','🥈','🥉'];
      document.getElementById('global-list').innerHTML = allGlobal.map((m, i) => {
        const rank = i + 1;
        const rankDisplay = rank <= 3 ? rankIcons[rank-1] : rank;
        const levelInfo = Engine.getLevelForXP(m.xp);
        return `
          <div class="global-row ${m.isYou ? 'you' : ''}">
            <div class="global-rank ${rank===1?'rank-1':rank===2?'rank-2':rank===3?'rank-3':''}">${rankDisplay}</div>
            <div class="global-avatar" style="background:${levelInfo.color}22;border-color:${levelInfo.color}44">${m.avatar}</div>
            <div class="global-name">
              ${m.name} ${m.isYou ? '<span class="you-tag">YOU</span>' : ''}
              <div style="font-size:11px;color:${levelInfo.color};font-weight:500;">Lv.${levelInfo.level} ${levelInfo.title}</div>
            </div>
            <div class="global-xp">${m.xp.toLocaleString()} XP</div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
